<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LifeORA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <a class="brand auth-brand" href="index.html">
      <img src="images/LOGO.jpg" alt="LifeORA Logo" class="logo-image">
      <span class="logo-text">LifeORA</span>
    </a>
    <h1>Welcome Back</h1>
    <p class="description">Login to continue to your LifeORA dashboard.</p>

    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input id="password" type="password" placeholder="Enter your password" required>

      <button class="primary full" type="submit">Login</button>
    </form>

    <p id="message" class="message"></p>
    <p class="bottom">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
