<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeORA | Find it. Use it. Pass it on.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <a class="brand" href="index.html">
    <img src="images/LOGO.jpg" alt="LifeORA Logo" class="logo-image">
    <span class="logo-text">LifeORA</span>
  </a>

  <nav>
    <a href="login.html">Login</a>
    <a class="nav-button" href="register.html">Register</a>
  </nav>
</header>

<main class="page">

  <section class="home-intro">
    <div>
      <p class="eyebrow">LIFEORA</p>
      <h1>Find it. Use it. Pass it on.</h1>
      <p class="home-text">
        Discover useful items from your college community. Browse available
        products first — no login required.
      </p>
      <div class="buttons">
        <a class="primary" href="login.html">Login to Continue</a>
        <a class="secondary" href="register.html">Create Account</a>
      </div>
    </div>
  </section>

  <section class="preview marketplace-preview">
    <div class="preview-head">
      <div>
        <p class="eyebrow">MARKETPLACE</p>
        <h2>Available Items</h2>
      </div>
      <span>Browse without logging in</span>
    </div>

    <div id="dashboardItems" class="preview-grid"></div>
    <p id="dashboardMessage" class="click-note"></p>
  </section>

</main>

<script src="js/home.js"></script>
</body>
</html>
