<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | LifeORA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <a class="brand auth-brand" href="index.html">
      <img src="images/LOGO.jpg" alt="LifeORA Logo" class="logo-image">
      <span class="logo-text">LifeORA</span>
    </a>
    <h1>Create Account</h1>
    <p class="description">Create your account to explore LifeORA.</p>

    <form id="registerForm">
      <label>Name</label>
      <input id="name" type="text" placeholder="Enter your name" required>

      <label>Email</label>
      <input id="email" type="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input id="password" type="password" placeholder="Enter your password" required>

      <label>Role</label>
      <select id="role" required>
        <option value="">Select role</option>
        <option value="Buyer">Buyer</option>
        <option value="Seller">Seller</option>
        <option value="Repairer">Repairer</option>
        <option value="Admin">Admin</option>
      </select>

      <button class="primary full" type="submit">Register</button>
    </form>

    <p id="message" class="message"></p>
    <p class="bottom">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
